name: Add Embroidered Fleece Sweatpants
on:
  pull_request:
    types: [opened, reopened]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add sweatpants product
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          if 'id="sweatpantsModal"' in s:
              raise SystemExit('Sweatpants already present')
          # Add product card immediately after the Men’s Muscle Tank card.
          card='''<article class="product-card" data-category="mens"><div class="product-image"><img src="IMG_0360.jpeg" alt="Gangster Bougie Embroidered Fleece Sweatpants"><button class="quick-view" id="openSweatpants">Quick View</button></div><div class="product-info"><h3>Gangster Bougie Embroidered Fleece Sweatpants</h3><p>8 colourways • US$69.99</p></div></article>'''
          muscle='id="openMuscleTank"'
          pos=s.index(muscle)
          card_end=s.index('</article>',pos)+len('</article>')
          s=s[:card_end]+card+s[card_end:]
          # Add modal before leggings modal, following the established product-view structure.
          modal='''<div class="modal" id="sweatpantsModal"><div class="modal-panel sports-panel"><button class="modal-back" id="closeSweatpants">Back</button><div class="sports-top"><div class="sports-stage"><button class="sports-arrow prev" id="sweatpantsPrev" aria-label="Previous image">‹</button><img id="sweatpantsMain" src="IMG_0360.jpeg" alt="Black"><button class="sports-arrow next" id="sweatpantsNext" aria-label="Next image">›</button></div><div class="sports-details"><h2>Gangster Bougie Embroidered Fleece Sweatpants</h2><div class="sports-price">US$69.99</div><p>Premium fleece sweatpants built for everyday comfort, gym-to-street wear, and relaxed luxury styling. Finished with embroidered Gangster Bougie branding for a clean, elevated look.</p><ul class="sports-benefits"><li>Soft, tightly knit 3-end fleece</li><li>100% cotton face; cotton/polyester blend</li><li>Elastic waistband with matching drawstrings</li><li>Cuffed legs with ribbed waist and cuffs</li><li>Two front cross pockets and a back patch pocket</li><li>Embroidered Gangster Bougie logo</li></ul><div class="sports-divider"></div><div class="sports-option-title">Colour: <span id="sweatpantsColour">Black</span></div><div class="sports-colors sweatpants-colors"><button class="sports-swatch sweatpants-swatch active" data-index="0" data-colour="Black" style="background:#111" aria-label="Black"></button><button class="sports-swatch sweatpants-swatch" data-index="1" data-colour="Maroon" style="background:#741f32" aria-label="Maroon"></button><button class="sports-swatch sweatpants-swatch" data-index="2" data-colour="Charcoal Heather" style="background:#55585b" aria-label="Charcoal Heather"></button><button class="sports-swatch sweatpants-swatch" data-index="3" data-colour="Navy Blazer" style="background:#17243a" aria-label="Navy Blazer"></button><button class="sports-swatch sweatpants-swatch" data-index="4" data-colour="Carbon Grey" style="background:#a5a5a2" aria-label="Carbon Grey"></button><button class="sports-swatch sweatpants-swatch" data-index="5" data-colour="Military Green" style="background:#6b6541" aria-label="Military Green"></button><button class="sports-swatch sweatpants-swatch" data-index="6" data-colour="Dusty Rose" style="background:#d58f8c" aria-label="Dusty Rose"></button><button class="sports-swatch sweatpants-swatch" data-index="7" data-colour="White" style="background:#f4f1e8" aria-label="White"></button></div><div class="sports-size-block"><div class="sports-option-title">Size</div><div class="sizes"><button class="size-btn sweatpants-size">S</button><button class="size-btn sweatpants-size">M</button><button class="size-btn sweatpants-size">L</button><button class="size-btn sweatpants-size">XL</button><button class="size-btn sweatpants-size">2XL</button></div></div><button class="add-cart-preview">Add to Cart — Preview</button><div class="cart-note">Cart connection coming soon.</div></div></div><div class="sports-gallery sweatpants-gallery"><button class="thumb sports-thumb sweatpants-thumb active" data-img="IMG_0360.jpeg" data-label="Black" data-colour="Black"><img src="IMG_0360.jpeg" alt="Black"><span class="sports-thumb-label">Black</span></button><button class="thumb sports-thumb sweatpants-thumb" data-img="IMG_0361.jpeg" data-label="Maroon" data-colour="Maroon"><img src="IMG_0361.jpeg" alt="Maroon"><span class="sports-thumb-label">Maroon</span></button><button class="thumb sports-thumb sweatpants-thumb" data-img="IMG_0362.jpeg" data-label="Charcoal Heather" data-colour="Charcoal Heather"><img src="IMG_0362.jpeg" alt="Charcoal Heather"><span class="sports-thumb-label">Charcoal<br>Heather</span></button><button class="thumb sports-thumb sweatpants-thumb" data-img="IMG_0363.jpeg" data-label="Navy Blazer" data-colour="Navy Blazer"><img src="IMG_0363.jpeg" alt="Navy Blazer"><span class="sports-thumb-label">Navy<br>Blazer</span></button><button class="thumb sports-thumb sweatpants-thumb" data-img="IMG_0364.jpeg" data-label="Carbon Grey" data-colour="Carbon Grey"><img src="IMG_0364.jpeg" alt="Carbon Grey"><span class="sports-thumb-label">Carbon<br>Grey</span></button><button class="thumb sports-thumb sweatpants-thumb" data-img="IMG_0365.jpeg" data-label="Military Green" data-colour="Military Green"><img src="IMG_0365.jpeg" alt="Military Green"><span class="sports-thumb-label">Military<br>Green</span></button><button class="thumb sports-thumb sweatpants-thumb" data-img="IMG_0366.jpeg" data-label="Dusty Rose" data-colour="Dusty Rose"><img src="IMG_0366.jpeg" alt="Dusty Rose"><span class="sports-thumb-label">Dusty<br>Rose</span></button><button class="thumb sports-thumb sweatpants-thumb" data-img="IMG_0367.jpeg" data-label="White" data-colour="White"><img src="IMG_0367.jpeg" alt="White"><span class="sports-thumb-label">White</span></button></div></div></div>'''
          marker='<div class="modal" id="leggingsModal">'
          s=s.replace(marker,modal+marker,1)
          # Add behaviour before the closing script/body using same simple modal conventions.
          js='''\n<script>\n(()=>{const modal=document.getElementById('sweatpantsModal'),open=document.getElementById('openSweatpants'),close=document.getElementById('closeSweatpants'),main=document.getElementById('sweatpantsMain'),colour=document.getElementById('sweatpantsColour'),thumbs=[...document.querySelectorAll('.sweatpants-thumb')],swatches=[...document.querySelectorAll('.sweatpants-swatch')];let i=0;function show(n){i=(n+thumbs.length)%thumbs.length;const t=thumbs[i];main.src=t.dataset.img;main.alt=t.dataset.label;colour.textContent=t.dataset.colour;thumbs.forEach((x,j)=>x.classList.toggle('active',j===i));swatches.forEach((x,j)=>x.classList.toggle('active',j===i));}open&&open.addEventListener('click',()=>{modal.classList.add('open');show(0)});close&&close.addEventListener('click',()=>modal.classList.remove('open'));document.getElementById('sweatpantsPrev')?.addEventListener('click',()=>show(i-1));document.getElementById('sweatpantsNext')?.addEventListener('click',()=>show(i+1));thumbs.forEach((t,j)=>t.addEventListener('click',()=>show(j)));swatches.forEach((t,j)=>t.addEventListener('click',()=>show(j)));document.querySelectorAll('.sweatpants-size').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.sweatpants-size').forEach(x=>x.classList.remove('active'));b.classList.add('active')}));})();\n</script>\n'''
          s=s.replace('</body>',js+'</body>',1)
          p.write_text(s)
      - name: Commit sweatpants
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add embroidered fleece sweatpants product"
          git push origin main