name: Fix Sweatpants Card Button
on:
  pull_request:
    types: [opened, reopened]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Match sweatpants View Item button to product cards
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          old='<button class="product-btn" id="openSweatpants">View Item</button>'
          new='<button class="view-item" id="openSweatpants">VIEW ITEM</button>'
          if old not in s: raise SystemExit('Expected sweatpants button not found')
          s=s.replace(old,new,1)
          p.write_text(s)
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Match sweatpants View Item button styling"
          git push origin main