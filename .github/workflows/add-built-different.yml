name: Fix Sweatpants View Item
on:
  pull_request:
    types: [opened, reopened]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fix sweatpants card and modal styling
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='<article class="product-card" data-category="mens"><div class="product-image"><img src="IMG_0360.jpeg" alt="Gangster Bougie Embroidered Fleece Sweatpants"><button class="quick-view" id="openSweatpants">Quick View</button></div><div class="product-info"><h3>Gangster Bougie Embroidered Fleece Sweatpants</h3><p>8 colourways • US$69.99</p></div></article>'
          new='<article class="product-card" data-category="mens"><img src="IMG_0360.jpeg" alt="Gangster Bougie Embroidered Fleece Sweatpants"><div class="product-info"><h3>Gangster Bougie Embroidered Fleece Sweatpants</h3><p>8 colourways • US$69.99</p><button class="product-btn" id="openSweatpants">View Item</button></div></article>'
          if old not in s: raise SystemExit('Expected sweatpants card not found')
          s=s.replace(old,new,1)
          s=s.replace('<div class="modal" id="sweatpantsModal"><div class="modal-panel sports-panel"><button class="modal-back" id="closeSweatpants">Back</button><div class="sports-top"><div class="sports-stage">','<div class="modal" id="sweatpantsModal"><div class="modal-box sports-modal-box"><button class="modal-close" id="closeSweatpants">×</button><div class="sports-layout"><div class="main-product-photo sports-main-wrap sports-stage">',1)
          s=s.replace('</div><div class="sports-details"><h2>Gangster Bougie Embroidered Fleece Sweatpants</h2>','</div><div class="sports-info"><h2>Gangster Bougie Embroidered Fleece Sweatpants</h2>',1)
          p.write_text(s)
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix sweatpants View Item and product modal"
          git push origin main