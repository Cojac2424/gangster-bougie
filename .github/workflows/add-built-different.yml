name: Fix Sweatpants Template And Colours
on:
  pull_request:
    types: [opened, reopened]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Rebuild sweatpants with established product template
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          title='<h3>Gangster Bougie Embroidered Fleece Sweatpants</h3>'; t=s.index(title); a=s.rfind('<article class="product-card"',0,t); b=s.index('</article>',t)+len('</article>')
          s=s[:a]+'<article class="product-card" data-category="mens"><img src="IMG_0367.jpeg" alt="Gangster Bougie Embroidered Fleece Sweatpants"><div class="product-info"><h3>Gangster Bougie Embroidered Fleece Sweatpants</h3><p>8 colourways • US$69.99</p><button class="product-btn" id="openSweatpants">View Item</button></div></article>'+s[b:]
          a=s.index('<div class="modal" id="sweatpantsModal">'); b=s.index('<div class="modal" id="leggingsModal">',a)
          modal='''<div class="modal" id="sweatpantsModal"><div class="modal-box sports-modal-box"><button class="modal-close" id="closeSweatpants">×</button><div class="sports-layout"><div class="main-product-photo sports-main-wrap sports-stage"><img id="sweatpantsMain" src="IMG_0367.jpeg" alt="Black"><button class="sports-arrow prev" id="sweatpantsPrev">‹</button><button class="sports-arrow next" id="sweatpantsNext">›</button></div><div class="sports-info"><h2>Gangster Bougie Embroidered Fleece Sweatpants</h2><div class="sports-price">US$69.99</div><p class="sports-description">Premium fleece sweatpants built for everyday comfort, gym-to-street wear, and relaxed luxury styling. Finished with embroidered Gangster Bougie branding for a clean, elevated look.</p><ul class="sports-benefits"><li>Soft, tightly knit 3-end fleece</li><li>100% cotton face; cotton/polyester blend</li><li>Elastic waistband with matching drawstrings</li><li>Cuffed legs with ribbed waist and cuffs</li><li>Two front cross pockets and a back patch pocket</li><li>Embroidered Gangster Bougie logo</li></ul><hr class="sports-divider"><div class="sports-colour-line">Colour: <strong id="sweatpantsColour">Black</strong></div><div class="sports-colors"><button class="sports-color sweatpants-swatch black active" data-index="0" aria-label="Black"></button><button class="sports-color sweatpants-swatch" data-index="1" aria-label="Maroon" style="background:#741f32"></button><button class="sports-color sweatpants-swatch charcoal" data-index="2" aria-label="Charcoal Heather"></button><button class="sports-color sweatpants-swatch navy" data-index="3" aria-label="Navy Blazer"></button><button class="sports-color sweatpants-swatch" data-index="4" aria-label="Carbon Grey" style="background:#a5a5a2"></button><button class="sports-color sweatpants-swatch" data-index="5" aria-label="Military Green" style="background:#6b6541"></button><button class="sports-color sweatpants-swatch" data-index="6" aria-label="Dusty Rose" style="background:#d58f8c"></button><button class="sports-color sweatpants-swatch white" data-index="7" aria-label="White"></button></div><div class="sports-buy-row"><div class="sports-size-block"><span class="option-label">Size:</span><div class="sizes"><button class="size sweatpants-size">S</button><button class="size sweatpants-size">M</button><button class="size sweatpants-size">L</button><button class="size sweatpants-size">XL</button><button class="size sweatpants-size">2XL</button></div></div><button class="sports-add" type="button"><span>🛒</span>Add to Cart</button></div><div class="sports-preview-note">Cart connection coming soon.</div></div><div class="sports-gallery"><button class="thumb sports-thumb sweatpants-thumb active" data-img="IMG_0367.jpeg" data-label="Black" data-colour="Black"><img src="IMG_0367.jpeg" alt="Black"><span class="sports-thumb-label">Black</span></button><button class="thumb sports-thumb sweatpants-thumb" data-img="IMG_0366.jpeg" data-label="Maroon" data-colour="Maroon"><img src="IMG_0366.jpeg" alt="Maroon"><span class="sports-thumb-label">Maroon</span></button><button class="thumb sports-thumb sweatpants-thumb" data-img="IMG_0365.jpeg" data-label="Charcoal Heather" data-colour="Charcoal Heather"><img src="IMG_0365.jpeg" alt="Charcoal Heather"><span class="sports-thumb-label">Charcoal<br>Heather</span></button><button class="thumb sports-thumb sweatpants-thumb" data-img="IMG_0364.jpeg" data-label="Navy Blazer" data-colour="Navy Blazer"><img src="IMG_0364.jpeg" alt="Navy Blazer"><span class="sports-thumb-label">Navy<br>Blazer</span></button><button class="thumb sports-thumb sweatpants-thumb" data-img="IMG_0363.jpeg" data-label="Carbon Grey" data-colour="Carbon Grey"><img src="IMG_0363.jpeg" alt="Carbon Grey"><span class="sports-thumb-label">Carbon<br>Grey</span></button><button class="thumb sports-thumb sweatpants-thumb" data-img="IMG_0362.jpeg" data-label="Military Green" data-colour="Military Green"><img src="IMG_0362.jpeg" alt="Military Green"><span class="sports-thumb-label">Military<br>Green</span></button><button class="thumb sports-thumb sweatpants-thumb" data-img="IMG_0361.jpeg" data-label="Dusty Rose" data-colour="Dusty Rose"><img src="IMG_0361.jpeg" alt="Dusty Rose"><span class="sports-thumb-label">Dusty<br>Rose</span></button><button class="thumb sports-thumb sweatpants-thumb" data-img="IMG_0360.jpeg" data-label="White" data-colour="White"><img src="IMG_0360.jpeg" alt="White"><span class="sports-thumb-label">White</span></button></div></div></div></div>'''
          s=s[:a]+modal+s[b:]
          p.write_text(s)
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix sweatpants template and colour mapping"
          git push origin main