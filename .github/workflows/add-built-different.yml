name: Fix Sweatpants Exact Card Template
on:
  pull_request:
    types: [opened, reopened]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Rebuild sweatpants exterior card with established product classes
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          marker='<button class="view-item" id="openSweatpants">VIEW ITEM</button>'
          pos=s.index(marker)
          start=s.rfind('<article',0,pos)
          end=s.index('</article>',pos)+len('</article>')
          # These are the exact site classes that control the working cards:
          # product-image + product-accent + product-tag + product-name + product-status + view-item.
          new='''<article class="product-card" data-category="mens"><div class="product-image"><img src="IMG_0367.jpeg" alt="Gangster Bougie Embroidered Fleece Sweatpants"></div><div class="product-accent"></div><div class="product-info"><div class="product-tag">MEN’S • BOTTOMS</div><h3 class="product-name">GANGSTER BOUGIE EMBROIDERED FLEECE SWEATPANTS</h3><p class="product-status">8 colourways • US$69.99</p><button class="view-item" id="openSweatpants">VIEW ITEM</button></div></article>'''
          s=s[:start]+new+s[end:]
          p.write_text(s)
      - name: Commit exact card fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Use exact established classes for sweatpants card"
          git push origin main