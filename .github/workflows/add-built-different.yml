name: Fix Mens Muscle Tank Images
on:
  pull_request:
    types: [opened, reopened]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Correct White and Pink Muscle Tank images
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          start=s.index('<div class="modal" id="muscleTankModal">')
          end=s.index('<div class="modal" id="leggingsModal">', start)
          block=s[start:end]
          old_white_front='<button class="thumb sports-thumb muscle-thumb active" data-img="IMG_0349.jpeg" data-label="White front" data-colour="White"><img src="IMG_0349.jpeg" alt="White front"><span class="sports-thumb-label">White<br>Front</span></button>'
          new_white_front='<button class="thumb sports-thumb muscle-thumb active" data-img="IMG_0357.jpeg" data-label="White front" data-colour="White"><img src="IMG_0357.jpeg" alt="White front"><span class="sports-thumb-label">White<br>Front</span></button>'
          old_white_back='<button class="thumb sports-thumb muscle-thumb" data-img="IMG_2108.jpeg" data-label="White back" data-colour="White"><img src="IMG_2108.jpeg" alt="White back"><span class="sports-thumb-label">White<br>Back</span></button>'
          new_white_back='<button class="thumb sports-thumb muscle-thumb" data-img="IMG_0358.jpeg" data-label="White back" data-colour="White"><img src="IMG_0358.jpeg" alt="White back"><span class="sports-thumb-label">White<br>Back</span></button>'
          old_pink_front='<button class="thumb sports-thumb muscle-thumb" data-img="IMG_0357.jpeg" data-label="Pink front" data-colour="Pink"><img src="IMG_0357.jpeg" alt="Pink front"><span class="sports-thumb-label">Pink<br>Front</span></button>'
          new_pink_front='<button class="thumb sports-thumb muscle-thumb" data-img="IMG_0349.jpeg" data-label="Pink front" data-colour="Pink"><img src="IMG_0349.jpeg" alt="Pink front"><span class="sports-thumb-label">Pink<br>Front</span></button>'
          old_pink_back='<button class="thumb sports-thumb muscle-thumb" data-img="IMG_0358.jpeg" data-label="Pink back" data-colour="Pink"><img src="IMG_0358.jpeg" alt="Pink back"><span class="sports-thumb-label">Pink<br>Back</span></button>'
          new_pink_back='<button class="thumb sports-thumb muscle-thumb" data-img="IMG_2108.jpeg" data-label="Pink back" data-colour="Pink"><img src="IMG_2108.jpeg" alt="Pink back"><span class="sports-thumb-label">Pink<br>Back</span></button>'
          for old,new in [(old_white_front,new_white_front),(old_white_back,new_white_back),(old_pink_front,new_pink_front),(old_pink_back,new_pink_back)]:
              if old not in block: raise SystemExit('Expected Muscle Tank gallery entry missing')
              block=block.replace(old,new,1)
          block=block.replace('id="muscleTankMain" src="IMG_0357.jpeg" alt="White front"','id="muscleTankMain" src="IMG_0357.jpeg" alt="White front"',1)
          s=s[:start]+block+s[end:]
          p.write_text(s)
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Correct White and Pink Muscle Tank images"
          git push origin main