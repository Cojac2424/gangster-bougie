name: Add leggings product layout
on:
  push:
    paths:
      - '.github/workflows/add-leggings-layout.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update leggings product
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='<article class="product-card" data-category="activewear"><div class="product-accent"></div><div class="product-info"><div class="product-tag">Activewear</div><div class="product-name">High Waisted Yoga Leggings (AOP)</div><div class="product-status">Launch item</div></div></article>'
          new='<article class="product-card" data-category="activewear"><div class="product-image"><img src="IMG_0281.jpeg" alt="Gangster Bougie High-Waisted Leggings"></div><div class="product-accent"></div><div class="product-info"><div class="product-tag">Activewear • Drop 01</div><div class="product-name">Gangster Bougie High-Waisted Leggings</div><div class="product-status">8 colourways • US$69.99</div><button class="view-item" id="openLeggings">View Item</button></div></article>'
          if old not in s: raise SystemExit('leggings product card target not found')
          s=s.replace(old,new,1)
          modal='''<div class="modal" id="leggingsModal"><div class="modal-box sports-modal-box"><button class="modal-close" id="closeLeggings">×</button><div class="sports-layout"><div class="main-product-photo sports-main-wrap sports-stage"><img id="leggingsMain" src="IMG_0281.jpeg" alt="White front"><button class="sports-arrow prev" id="leggingsPrev" aria-label="Previous leggings image">‹</button><button class="sports-arrow next" id="leggingsNext" aria-label="Next leggings image">›</button></div><div class="sports-info"><h2>Gangster Bougie High-Waisted Leggings</h2><div class="sports-price">US$69.99</div><p class="sports-description">High-waisted leggings designed for workouts, movement and everyday streetwear. Finished with signature Gangster Bougie branding for a clean, fitted activewear look.</p><ul class="sports-benefits"><li>Women’s high-waisted athletic fit</li><li>Signature GB branding</li><li>Gold “Baddie” detail on the back waistband</li><li>Runs small — consider sizing up</li></ul><hr class="sports-divider"><div class="sports-colour-line">Colour: <strong id="leggingsColourName">White</strong></div><div class="sports-colors"><button class="sports-color white active" data-index="0" aria-label="White"></button><button class="sports-color black" data-index="2" aria-label="Black"></button><button class="sports-color green" data-index="4" aria-label="Green"></button><button class="sports-color charcoal" data-index="6" aria-label="Grey"></button><button class="sports-color lightblue" data-index="8" aria-label="Light Blue"></button><button class="sports-color navy" data-index="10" aria-label="Navy"></button><button class="sports-color brown" data-index="12" aria-label="Brown"></button><button class="sports-color red" data-index="14" aria-label="Red"></button></div><div class="sports-buy-row"><div class="sports-size-block"><span class="option-label">Size:</span><div class="sizes"><button class="size leggings-size">XS</button><button class="size leggings-size">S</button><button class="size leggings-size">M</button><button class="size leggings-size">L</button><button class="size leggings-size">XL</button><button class="size leggings-size">2XL</button></div></div><button class="sports-add" type="button" aria-label="Add to cart coming soon"><span>🛒</span>Add to Cart</button></div><div class="sports-preview-note">Cart connection coming soon.</div></div><div class="sports-gallery"><button class="thumb sports-thumb leggings-thumb active" data-img="IMG_0281.jpeg" data-label="White front" data-colour="White"><img src="IMG_0281.jpeg" alt="White front"><span class="sports-thumb-label">White<br>Front</span></button><button class="thumb sports-thumb leggings-thumb" data-img="IMG_0282.jpeg" data-label="White back" data-colour="White"><img src="IMG_0282.jpeg" alt="White back"><span class="sports-thumb-label">White<br>Back</span></button><button class="thumb sports-thumb leggings-thumb" data-img="IMG_0283.jpeg" data-label="Black front" data-colour="Black"><img src="IMG_0283.jpeg" alt="Black front"><span class="sports-thumb-label">Black<br>Front</span></button><button class="thumb sports-thumb leggings-thumb" data-img="IMG_0284.jpeg" data-label="Black back" data-colour="Black"><img src="IMG_0284.jpeg" alt="Black back"><span class="sports-thumb-label">Black<br>Back</span></button><button class="thumb sports-thumb leggings-thumb" data-img="IMG_0285.jpeg" data-label="Green front" data-colour="Green"><img src="IMG_0285.jpeg" alt="Green front"><span class="sports-thumb-label">Green<br>Front</span></button><button class="thumb sports-thumb leggings-thumb" data-img="IMG_0286.jpeg" data-label="Green back" data-colour="Green"><img src="IMG_0286.jpeg" alt="Green back"><span class="sports-thumb-label">Green<br>Back</span></button><button class="thumb sports-thumb leggings-thumb" data-img="IMG_0287.jpeg" data-label="Grey front" data-colour="Grey"><img src="IMG_0287.jpeg" alt="Grey front"><span class="sports-thumb-label">Grey<br>Front</span></button><button class="thumb sports-thumb leggings-thumb" data-img="IMG_0288.jpeg" data-label="Grey back" data-colour="Grey"><img src="IMG_0288.jpeg" alt="Grey back"><span class="sports-thumb-label">Grey<br>Back</span></button><button class="thumb sports-thumb leggings-thumb" data-img="IMG_0289.jpeg" data-label="Light Blue front" data-colour="Light Blue"><img src="IMG_0289.jpeg" alt="Light Blue front"><span class="sports-thumb-label">Light Blue<br>Front</span></button><button class="thumb sports-thumb leggings-thumb" data-img="IMG_0290.jpeg" data-label="Light Blue back" data-colour="Light Blue"><img src="IMG_0290.jpeg" alt="Light Blue back"><span class="sports-thumb-label">Light Blue<br>Back</span></button><button class="thumb sports-thumb leggings-thumb" data-img="IMG_0291.jpeg" data-label="Navy front" data-colour="Navy"><img src="IMG_0291.jpeg" alt="Navy front"><span class="sports-thumb-label">Navy<br>Front</span></button><button class="thumb sports-thumb leggings-thumb" data-img="IMG_0292.jpeg" data-label="Navy back" data-colour="Navy"><img src="IMG_0292.jpeg" alt="Navy back"><span class="sports-thumb-label">Navy<br>Back</span></button><button class="thumb sports-thumb leggings-thumb" data-img="IMG_0293.jpeg" data-label="Brown front" data-colour="Brown"><img src="IMG_0293.jpeg" alt="Brown front"><span class="sports-thumb-label">Brown<br>Front</span></button><button class="thumb sports-thumb leggings-thumb" data-img="IMG_0294.jpeg" data-label="Brown back" data-colour="Brown"><img src="IMG_0294.jpeg" alt="Brown back"><span class="sports-thumb-label">Brown<br>Back</span></button><button class="thumb sports-thumb leggings-thumb" data-img="IMG_0295.jpeg" data-label="Red front" data-colour="Red"><img src="IMG_0295.jpeg" alt="Red front"><span class="sports-thumb-label">Red<br>Front</span></button><button class="thumb sports-thumb leggings-thumb" data-img="IMG_0296.jpeg" data-label="Red back" data-colour="Red"><img src="IMG_0296.jpeg" alt="Red back"><span class="sports-thumb-label">Red<br>Back</span></button></div></div></div></div>'''
          marker='<audio id="bgMusic"'
          if marker not in s: raise SystemExit('audio insertion marker not found')
          s=s.replace(marker,modal+'\n'+marker,1)
          js="""const leggingsModal=document.getElementById('leggingsModal'),leggingsMain=document.getElementById('leggingsMain'),leggingsThumbs=[...document.querySelectorAll('#leggingsModal .leggings-thumb')],leggingsColourName=document.getElementById('leggingsColourName'),leggingsColors=[...document.querySelectorAll('#leggingsModal .sports-color')];let leggingsIndex=0;function showLeggingsImage(i){leggingsIndex=(i+leggingsThumbs.length)%leggingsThumbs.length;const t=leggingsThumbs[leggingsIndex];leggingsMain.src=t.dataset.img;leggingsMain.alt=t.dataset.label||t.querySelector('img').alt;leggingsThumbs.forEach(x=>x.classList.remove('active'));t.classList.add('active');const colour=t.dataset.colour||'';leggingsColourName.textContent=colour;leggingsColors.forEach(x=>x.classList.toggle('active',x.getAttribute('aria-label')===colour))}document.getElementById('openLeggings').onclick=()=>{leggingsModal.classList.add('open');document.body.style.overflow='hidden';showLeggingsImage(leggingsIndex)};function closeLeggingsModal(){leggingsModal.classList.remove('open');document.body.style.overflow=''}document.getElementById('closeLeggings').onclick=closeLeggingsModal;leggingsModal.addEventListener('click',e=>{if(e.target===leggingsModal)closeLeggingsModal()});leggingsThumbs.forEach((t,i)=>t.onclick=()=>showLeggingsImage(i));leggingsColors.forEach(c=>c.onclick=()=>showLeggingsImage(Number(c.dataset.index)));document.getElementById('leggingsPrev').onclick=()=>showLeggingsImage(leggingsIndex-1);document.getElementById('leggingsNext').onclick=()=>showLeggingsImage(leggingsIndex+1);document.querySelectorAll('.leggings-size').forEach(b=>b.onclick=()=>{document.querySelectorAll('.leggings-size').forEach(x=>x.classList.remove('active'));b.classList.add('active')});"""
          marker2='const bgMusic=document.getElementById(\'bgMusic\')'
          if marker2 not in s: raise SystemExit('javascript insertion marker not found')
          s=s.replace(marker2,js+marker2,1)
          p.write_text(s)
          PY
      - name: Commit leggings layout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add leggings product layout" || exit 0
          git push
