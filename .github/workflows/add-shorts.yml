name: Add workout shorts
on:
  push:
    paths:
      - '.github/workflows/add-shorts.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          old='<article class="product-card" data-category="activewear"><div class="product-accent"></div><div class="product-info"><div class="product-tag">Activewear</div><div class="product-name">Women’s Workout Shorts (AOP)</div><div class="product-status">Launch item</div></div></article>'
          new='<article class="product-card" data-category="activewear"><div class="product-image"><img src="IMG_0300.jpeg" alt="Gangster Bougie Women’s Workout Shorts"></div><div class="product-accent"></div><div class="product-info"><div class="product-tag">Activewear • Drop 01</div><div class="product-name">Gangster Bougie Women’s Workout Shorts</div><div class="product-status">8 colourways • US$59.99</div><button class="view-item" id="openShorts">View Item</button></div></article>'
          assert old in s
          s=s.replace(old,new,1)
          colors=[('White','white'),('Green','green'),('Red','red'),('Brown','brown'),('Blue','navy'),('Light Blue','lightblue'),('Black','black'),('Grey','charcoal')]
          thumbs=[]; sw=[]
          for i,(name,cls) in enumerate(colors):
              n=300+i*2
              sw.append(f'<button class="sports-color {cls}{" active" if i==0 else ""}" data-index="{i*2}" aria-label="{name}"></button>')
              for j,side in enumerate(('Front','Back')):
                  fn=f'IMG_{n+j:04d}.jpeg'; active=' active' if i==0 and j==0 else ''
                  thumbs.append(f'<button class="thumb sports-thumb shorts-thumb{active}" data-img="{fn}" data-label="{name} {side.lower()}" data-colour="{name}"><img src="{fn}" alt="{name} {side.lower()}"><span class="sports-thumb-label">{name}<br>{side}</span></button>')
          modal='<div class="modal" id="shortsModal"><div class="modal-box sports-modal-box"><button class="modal-close" id="closeShorts">×</button><div class="sports-layout"><div class="main-product-photo sports-main-wrap sports-stage"><img id="shortsMain" src="IMG_0300.jpeg" alt="White front"><button class="sports-arrow prev" id="shortsPrev" aria-label="Previous shorts image">‹</button><button class="sports-arrow next" id="shortsNext" aria-label="Next shorts image">›</button></div><div class="sports-info"><h2>Gangster Bougie Women’s Workout Shorts</h2><div class="sports-price">US$59.99</div><p class="sports-description">Sleek, fitted workout shorts designed to pair with the Gangster Bougie activewear collection. Finished with signature GB and Baddie branding for a clean, confident gym-to-street look.</p><ul class="sports-benefits"><li>Women’s high-waisted athletic fit</li><li>Stretch performance design</li><li>Signature GB front branding</li><li>Gold “Baddie” detail on the back</li></ul><hr class="sports-divider"><div class="sports-colour-line">Colour: <strong id="shortsColourName">White</strong></div><div class="sports-colors">'+''.join(sw)+'</div><div class="sports-buy-row"><div class="sports-size-block"><span class="option-label">Size:</span><div class="sizes"><button class="size shorts-size">XS</button><button class="size shorts-size">S</button><button class="size shorts-size">M</button><button class="size shorts-size">L</button><button class="size shorts-size">XL</button></div></div><button class="sports-add" type="button" aria-label="Add to cart coming soon"><span>🛒</span>Add to Cart</button></div><div class="sports-preview-note">Cart connection coming soon.</div></div><div class="sports-gallery">'+''.join(thumbs)+'</div></div></div></div>\n'
          marker='<div class="modal" id="leggingsModal">'
          assert marker in s
          s=s.replace(marker,modal+marker,1)
          js="const shortsModal=document.getElementById('shortsModal'),shortsMain=document.getElementById('shortsMain'),shortsThumbs=[...document.querySelectorAll('#shortsModal .shorts-thumb')],shortsColourName=document.getElementById('shortsColourName'),shortsColors=[...document.querySelectorAll('#shortsModal .sports-color')];let shortsIndex=0;function showShortsImage(i){shortsIndex=(i+shortsThumbs.length)%shortsThumbs.length;const t=shortsThumbs[shortsIndex];shortsMain.src=t.dataset.img;shortsMain.alt=t.dataset.label||t.querySelector('img').alt;shortsThumbs.forEach(x=>x.classList.remove('active'));t.classList.add('active');const colour=t.dataset.colour||'';shortsColourName.textContent=colour;shortsColors.forEach(x=>x.classList.toggle('active',x.getAttribute('aria-label')===colour))}document.getElementById('openShorts').onclick=()=>{shortsModal.classList.add('open');document.body.style.overflow='hidden';showShortsImage(shortsIndex)};function closeShortsModal(){shortsModal.classList.remove('open');document.body.style.overflow=''}document.getElementById('closeShorts').onclick=closeShortsModal;shortsModal.addEventListener('click',e=>{if(e.target===shortsModal)closeShortsModal()});shortsThumbs.forEach((t,i)=>t.onclick=()=>showShortsImage(i));shortsColors.forEach(c=>c.onclick=()=>showShortsImage(Number(c.dataset.index)));document.getElementById('shortsPrev').onclick=()=>showShortsImage(shortsIndex-1);document.getElementById('shortsNext').onclick=()=>showShortsImage(shortsIndex+1);document.querySelectorAll('.shorts-size').forEach(b=>b.onclick=()=>{document.querySelectorAll('.shorts-size').forEach(x=>x.classList.remove('active'));b.classList.add('active')});"
          marker2='const leggingsModal='
          assert marker2 in s
          s=s.replace(marker2,js+marker2,1)
          p.write_text(s)
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.html
          git commit -m "Build workout shorts product view"
          git push
