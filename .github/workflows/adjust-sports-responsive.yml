name: Adjust sports responsive layout
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/adjust-sports-responsive.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch responsive sports layout
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='</style>'
          css='''\n@media (min-width:681px) and (max-width:900px), (min-width:901px) and (hover:hover){
  .sports-layout{gap:20px 28px}
  .sports-info>.sports-divider,.sports-info>.sports-colour-line,.sports-info>.sports-colors,.sports-info>.sports-buy-row,.sports-info>.sports-preview-note{width:calc(202.05% + 28px);margin-left:calc(-102.05% - 28px)}
  .sports-info>.sports-divider{margin-top:10px;margin-bottom:10px}
  .sports-info>.sports-colour-line{margin-bottom:8px}
  .sports-info>.sports-colors{display:grid;grid-template-columns:repeat(8,1fr);justify-items:center;gap:10px}
  .sports-info>.sports-buy-row{display:grid;grid-template-columns:1fr;gap:12px;margin-top:14px}
  .sports-size-block{width:100%}
  .sports-size-block .sizes{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;width:100%}
  .sports-size-block .size{width:100%;height:48px}
  .sports-add{width:min(520px,72%);min-width:0;margin:0 auto;height:52px}
  .sports-info>.sports-preview-note{text-align:center;margin-top:5px}
  .sports-gallery{margin-top:0}
}\n'''
          if 'width:calc(202.05% + 28px)' not in s:
              s=s.replace(marker,css+marker,1)
              p.write_text(s)
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refine sports bra responsive controls"
          git push