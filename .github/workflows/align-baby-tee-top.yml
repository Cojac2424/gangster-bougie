name: Align Baby Tee top section
on:
  push:
    branches: [main]
    paths: ['.github/workflows/align-baby-tee-top.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Baby Tee alignment
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='</style></head>'
          css='''\n/* Baby Tee: align featured image bottom with description divider on iPad portrait / mobile landscape */\n@media (min-width:681px) and (max-width:900px){\n  #babyTeeModal .sports-stage{height:clamp(220px,31vw,275px);aspect-ratio:auto}\n  #babyTeeModal .sports-stage img{width:100%;height:100%;object-fit:contain}\n}\n'''
          if css.strip() not in s:
              s=s.replace(marker,css+marker)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Align Baby Tee image with product details' || exit 0
          git push
