name: Apply Baby Tee product layout
on:
  push:
    paths:
      - '.github/workflows/apply-baby-tee-product-layout.yml'
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Match Baby Tee to sports product layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          start=s.index('<div class="modal" id="babyTeeModal">')
          end=s.index('\n<div class="modal" id="sportsBraModal">', start)
          new='''<div class="modal" id="babyTeeModal"><div class="modal-box sports-modal-box"><button class="modal-close" id="closeBabyTee">×</button><div class="sports-layout"><div class="main-product-photo sports-main-wrap sports-stage"><img id="babyMain" src="IMG_1916.jpeg" alt="Black front"><button class="sports-arrow prev" id="babyPrev" aria-label="Previous Baby Tee image">‹</button><button class="sports-arrow next" id="babyNext" aria-label="Next Baby Tee image">›</button></div><div class="sports-info"><h2>Women’s Baby Tee</h2><div class="sports-price">Price coming soon</div><p class="sports-description">A fitted cropped baby tee with the signature Gangster Bougie statement graphic and Baddie back detail. Built for a clean street-luxe look.</p><ul class="sports-benefits"><li>Fitted cropped baby tee silhouette</li><li>Signature Gangster Bougie front graphic</li><li>“Baddie” back detail with GB monogram</li><li>Four colourways for a street-luxe look</li></ul><hr class="sports-divider"><div class="sports-colour-line">Colour: <strong id="babyColourName">Black</strong></div><div class="sports-colors baby-colors"><button class="sports-color black active" data-index="0" aria-label="Black"></button><button class="sports-color white" data-index="2" aria-label="White"></button><button class="sports-color baby-pink" data-index="4" aria-label="Pink"></button><button class="sports-color baby-grey" data-index="6" aria-label="Grey"></button></div><div class="sports-buy-row"><div class="sports-size-block"><span class="option-label">Size:</span><div class="sizes"><button class="size baby-size">XS</button><button class="size baby-size">S</button><button class="size baby-size">M</button><button class="size baby-size">L</button><button class="size baby-size">XL</button><button class="size baby-size">2XL</button></div></div><button class="sports-add" type="button" aria-label="Add to cart coming soon"><span>🛒</span>Add to Cart</button></div><div class="sports-preview-note">Cart connection coming soon.</div></div><div class="sports-gallery baby-gallery"><button class="thumb sports-thumb baby-thumb active" data-img="IMG_1916.jpeg" data-label="Black front" data-colour="Black"><img src="IMG_1916.jpeg" alt="Black front"><span class="sports-thumb-label">Black<br>Front</span></button><button class="thumb sports-thumb baby-thumb" data-img="IMG_1917.jpeg" data-label="Black back" data-colour="Black"><img src="IMG_1917.jpeg" alt="Black back"><span class="sports-thumb-label">Black<br>Back</span></button><button class="thumb sports-thumb baby-thumb" data-img="IMG_1905.jpeg" data-label="White front" data-colour="White"><img src="IMG_1905.jpeg" alt="White front"><span class="sports-thumb-label">White<br>Front</span></button><button class="thumb sports-thumb baby-thumb" data-img="IMG_1913.jpeg" data-label="White back" data-colour="White"><img src="IMG_1913.jpeg" alt="White back"><span class="sports-thumb-label">White<br>Back</span></button><button class="thumb sports-thumb baby-thumb" data-img="IMG_1918.jpeg" data-label="Pink front" data-colour="Pink"><img src="IMG_1918.jpeg" alt="Pink front"><span class="sports-thumb-label">Pink<br>Front</span></button><button class="thumb sports-thumb baby-thumb" data-img="IMG_1919.jpeg" data-label="Pink back" data-colour="Pink"><img src="IMG_1919.jpeg" alt="Pink back"><span class="sports-thumb-label">Pink<br>Back</span></button><button class="thumb sports-thumb baby-thumb" data-img="IMG_1914.jpeg" data-label="Grey front" data-colour="Grey"><img src="IMG_1914.jpeg" alt="Grey front"><span class="sports-thumb-label">Grey<br>Front</span></button><button class="thumb sports-thumb baby-thumb" data-img="IMG_1915.jpeg" data-label="Grey back" data-colour="Grey"><img src="IMG_1915.jpeg" alt="Grey back"><span class="sports-thumb-label">Grey<br>Back</span></button></div></div></div></div>'''
          s=s[:start]+new+s[end:]
          css='''\n/* Baby Tee uses the Sports Bra master product layout */\n.baby-pink{background:#e6a6b8}.baby-grey{background:#8d8d8d}\n.baby-gallery{grid-template-columns:repeat(8,1fr)}\n.baby-colors{grid-template-columns:repeat(4,minmax(0,1fr))!important}\n#babyTeeModal .sports-size-block .sizes{grid-template-columns:repeat(6,minmax(0,1fr))}\n@media(max-width:900px){.baby-gallery{grid-template-columns:repeat(4,1fr)}}\n@media(max-width:680px){#babyTeeModal .sports-size-block .sizes{grid-template-columns:repeat(6,minmax(0,1fr));gap:5px}#babyTeeModal .sports-size-block .size{font-size:.72rem}}\n'''
          s=s.replace('</style>',css+'</style>',1)
          js_start=s.index("const modal=document.getElementById('babyTeeModal')")
          js_end=s.index("const sportsModal=document.getElementById('sportsBraModal')",js_start)
          js="""const modal=document.getElementById('babyTeeModal'),main=document.getElementById('babyMain'),babyThumbs=[...document.querySelectorAll('.baby-thumb')],babyColourName=document.getElementById('babyColourName'),babyColors=[...document.querySelectorAll('#babyTeeModal .sports-color')];let babyIndex=0;function showBabyImage(i){babyIndex=(i+babyThumbs.length)%babyThumbs.length;const t=babyThumbs[babyIndex];main.src=t.dataset.img;main.alt=t.dataset.label||t.querySelector('img').alt;babyThumbs.forEach(x=>x.classList.remove('active'));t.classList.add('active');const colour=t.dataset.colour||'';babyColourName.textContent=colour;babyColors.forEach(x=>x.classList.toggle('active',x.getAttribute('aria-label')===colour))}document.getElementById('openBabyTee').onclick=()=>{modal.classList.add('open');document.body.style.overflow='hidden';showBabyImage(babyIndex)};function closeModal(){modal.classList.remove('open');document.body.style.overflow=''}document.getElementById('closeBabyTee').onclick=closeModal;modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});babyThumbs.forEach((t,i)=>t.onclick=()=>showBabyImage(i));babyColors.forEach(c=>c.onclick=()=>showBabyImage(Number(c.dataset.index)));document.getElementById('babyPrev').onclick=()=>showBabyImage(babyIndex-1);document.getElementById('babyNext').onclick=()=>showBabyImage(babyIndex+1);document.querySelectorAll('.baby-size').forEach(b=>b.onclick=()=>{document.querySelectorAll('.baby-size').forEach(x=>x.classList.remove('active'));b.classList.add('active')});"""
          s=s[:js_start]+js+s[js_end:]
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Match Baby Tee to sports product layout'
          git push