name: Apply Build Your Fit fixes
on:
  push:
    branches: [main]
    paths:
      - 'patch_rib_shorts.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Build Your Fit patch
        run: python patch_rib_shorts.py
      - name: Commit live site fix
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Apply Build Your Fit torso alignment fix"
          git push origin main
