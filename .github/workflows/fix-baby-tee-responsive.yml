name: Fix Baby Tee responsive sizing
on:
  push:
    paths:
      - '.github/workflows/fix-baby-tee-responsive.yml'
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix Baby Tee image overlap and 2XL fit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          css='''
/* Baby Tee responsive polish: keep colours visible and all six sizes contained */
#babyTeeModal .baby-size{min-width:0;padding:0 2px;white-space:nowrap}
@media (min-width:681px) and (max-width:900px){
  #babyTeeModal .sports-stage{aspect-ratio:auto;height:clamp(250px,36vw,320px)}
  #babyTeeModal .sports-stage img{width:100%;height:100%;object-fit:contain}
  #babyTeeModal .sports-info>.sports-divider{margin-top:6px}
  #babyTeeModal .sports-size-block .size{font-size:.78rem;padding:0 1px}
}
@media (min-width:901px) and (orientation:landscape){
  #babyTeeModal .sports-size-block .sizes{grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
  #babyTeeModal .sports-size-block .size{font-size:.76rem;padding:0;white-space:nowrap}
}
'''
          if '/* Baby Tee responsive polish:' not in s:
              s=s.replace('</style>',css+'</style>',1)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix Baby Tee responsive overlap and size fit'
          git push
