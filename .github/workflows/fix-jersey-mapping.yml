name: Fix jersey mapping
on:
  pull_request:
    types: [opened]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Correct jersey image mapping
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          # Collection cover: actual Dark Grey front.
          s=s.replace('<div class="product-image"><img src="IMG_0342.jpeg" alt="Dark Grey Gangster Bougie Men’s Basketball Jersey"></div>', '<div class="product-image"><img src="IMG_0340.jpeg" alt="Dark Grey Gangster Bougie Men’s Basketball Jersey"></div>', 1)
          # Featured image when product opens.
          s=s.replace('<img id="mensJerseyMain" src="IMG_0342.jpeg" alt="Dark Grey front">', '<img id="mensJerseyMain" src="IMG_0340.jpeg" alt="Dark Grey front">', 1)
          gallery='''<div class="sports-gallery jersey-gallery"><button class="thumb sports-thumb jersey-thumb" data-img="IMG_0329.jpeg" data-label="Black front" data-colour="Black"><img src="IMG_0329.jpeg" alt="Black front"><span class="sports-thumb-label">Black<br>Front</span></button><button class="thumb sports-thumb jersey-thumb" data-img="IMG_0330.jpeg" data-label="Black back" data-colour="Black"><img src="IMG_0330.jpeg" alt="Black back"><span class="sports-thumb-label">Black<br>Back</span></button><button class="thumb sports-thumb jersey-thumb" data-img="IMG_0336.jpeg" data-label="Dark Yellow front" data-colour="Dark Yellow"><img src="IMG_0336.jpeg" alt="Dark Yellow front"><span class="sports-thumb-label">Dark Yellow<br>Front</span></button><button class="thumb sports-thumb jersey-thumb" data-img="IMG_0337.jpeg" data-label="Dark Yellow back" data-colour="Dark Yellow"><img src="IMG_0337.jpeg" alt="Dark Yellow back"><span class="sports-thumb-label">Dark Yellow<br>Back</span></button><button class="thumb sports-thumb jersey-thumb" data-img="IMG_0334.jpeg" data-label="Dark Green front" data-colour="Dark Green"><img src="IMG_0334.jpeg" alt="Dark Green front"><span class="sports-thumb-label">Dark Green<br>Front</span></button><button class="thumb sports-thumb jersey-thumb" data-img="IMG_0335.jpeg" data-label="Dark Green back" data-colour="Dark Green"><img src="IMG_0335.jpeg" alt="Dark Green back"><span class="sports-thumb-label">Dark Green<br>Back</span></button><button class="thumb sports-thumb jersey-thumb" data-img="IMG_0342.jpeg" data-label="White front" data-colour="White"><img src="IMG_0342.jpeg" alt="White front"><span class="sports-thumb-label">White<br>Front</span></button><button class="thumb sports-thumb jersey-thumb" data-img="IMG_0343.jpeg" data-label="White back" data-colour="White"><img src="IMG_0343.jpeg" alt="White back"><span class="sports-thumb-label">White<br>Back</span></button><button class="thumb sports-thumb jersey-thumb" data-img="IMG_0338.jpeg" data-label="Dark Blue front" data-colour="Dark Blue"><img src="IMG_0338.jpeg" alt="Dark Blue front"><span class="sports-thumb-label">Dark Blue<br>Front</span></button><button class="thumb sports-thumb jersey-thumb" data-img="IMG_0339.png" data-label="Dark Blue back" data-colour="Dark Blue"><img src="IMG_0339.png" alt="Dark Blue back"><span class="sports-thumb-label">Dark Blue<br>Back</span></button><button class="thumb sports-thumb jersey-thumb" data-img="IMG_0327.jpeg" data-label="Dark Red front" data-colour="Dark Red"><img src="IMG_0327.jpeg" alt="Dark Red front"><span class="sports-thumb-label">Dark Red<br>Front</span></button><button class="thumb sports-thumb jersey-thumb" data-img="IMG_0328.jpeg" data-label="Dark Red back" data-colour="Dark Red"><img src="IMG_0328.jpeg" alt="Dark Red back"><span class="sports-thumb-label">Dark Red<br>Back</span></button><button class="thumb sports-thumb jersey-thumb active" data-img="IMG_0340.jpeg" data-label="Dark Grey front" data-colour="Dark Grey"><img src="IMG_0340.jpeg" alt="Dark Grey front"><span class="sports-thumb-label">Dark Grey<br>Front</span></button><button class="thumb sports-thumb jersey-thumb" data-img="IMG_0341.jpeg" data-label="Dark Grey back" data-colour="Dark Grey"><img src="IMG_0341.jpeg" alt="Dark Grey back"><span class="sports-thumb-label">Dark Grey<br>Back</span></button></div>'''
          pat=r'<div class="sports-gallery jersey-gallery">.*?</div>(?=</div></div></div>\n<div class="modal" id="leggingsModal")'
          s2,n=re.subn(pat,gallery,s,count=1,flags=re.S)
          if n!=1:
              raise SystemExit(f'jersey gallery replacement count={n}')
          p.write_text(s2)
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix men's jersey colour mapping and cover"
          git push origin main
