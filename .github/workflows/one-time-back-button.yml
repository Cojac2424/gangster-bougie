name: One-time product modal back button patch
on:
  push:
    paths:
      - '.github/workflows/one-time-back-button.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add always-visible Back button styling
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old=".modal-close{position:absolute;right:16px;top:12px;background:none;border:0;color:#fff;font-size:2rem;cursor:pointer}"
          new=".modal-close{position:fixed;right:max(18px,calc((100vw - 1100px)/2 + 18px));top:18px;z-index:110;background:#090909;border:2px solid var(--gold);color:var(--gold-light);font-size:0;font-weight:900;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;border-radius:999px;padding:10px 16px;box-shadow:0 4px 18px rgba(0,0,0,.55)}.modal-close::before{content:'← Back';font-size:.82rem}"
          if old not in s:
              raise SystemExit('Expected modal-close CSS not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit patch and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-time-back-button.yml
          git add index.html
          git commit -m 'Make product modal back button always visible'
          git push