name: Build Your Fit Alignment Fix
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-jersey-pr.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python patch_rib_shorts.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fine tune Build Your Fit waist alignment" || exit 0
          git push origin main
# waist-v5
