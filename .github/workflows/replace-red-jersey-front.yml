name: Replace red jersey front
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Replace only the Dark Red front image
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='data-img="IMG_0327.jpeg" data-label="Dark Red front" data-colour="Dark Red"><img src="IMG_0327.jpeg" alt="Dark Red front"'
          new='data-img="IMG_0344.jpeg" data-label="Dark Red front" data-colour="Dark Red"><img src="IMG_0344.jpeg" alt="Dark Red front"'
          if old not in s:
              raise SystemExit('Expected Dark Red front mapping not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit replacement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Replace marked red jersey front image"
          git push origin main
